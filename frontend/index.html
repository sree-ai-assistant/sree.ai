  <!-- PWA Install Banner Styles -->
  <style>
    #sree-pwa-banner {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 480px;
      box-sizing: border-box;
      z-index: 9999999;
      background: linear-gradient(135deg, rgba(10, 24, 21, 0.96), rgba(7, 14, 23, 0.96));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.45);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(16, 185, 129, 0.25);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      animation: sreePwaSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes sreePwaSlideIn {
      from {
        opacity: 0;
        transform: translate(-50%, -18px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    .sree-pwa-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .sree-pwa-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .sree-pwa-texts {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .sree-pwa-title {
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .sree-pwa-desc {
      font-size: 11px;
      color: #a1a1aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .sree-pwa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    #sree-pwa-install-action {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #051b14;
      font-weight: 700;
      font-size: 12px;
      border: none;
      border-radius: 10px;
      padding: 7px 14px;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.4);
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #sree-pwa-install-action:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.6);
    }

    #sree-pwa-install-action:active {
      transform: translateY(0);
    }

    #sree-pwa-close-action {
      background: none;
      border: none;
      color: #71717a;
      font-size: 20px;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
      border-radius: 6px;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #sree-pwa-close-action:hover {
      color: #e4e4e7;
    }

    @media (max-width: 480px) {
      #sree-pwa-banner {
        top: 10px;
        width: calc(100% - 16px);
        padding: 8px 10px;
        gap: 8px;
        border-radius: 12px;
      }

        width: 28px;
        height: 28px;
      }

      .sree-pwa-title {
        font-size: 12px;
      }

      }

        padding: 6px 11px;
        font-size: 11px;

      }

        padding: 0 4px;
      }

  </style>

  <!-- PWA Install Prompt Handler for Sree AI -->
  <script>
    window.deferredPrompt = null;

    try {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('install') === 'true') {
        sessionStorage.setItem('sree_pwa_install', 'true');
      }
    } catch (e) { }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-installable'));

      if (sessionStorage.getItem('sree_pwa_install') === 'true') {
        showPwaBanner();
      }
    });

    function showPwaBanner() {
      if (document.getElementById('sree-pwa-banner')) return;
      const banner = document.createElement('div');
      banner.id = 'sree-pwa-banner';
      banner.innerHTML = `
        <div class="sree-pwa-left">
          <img src="/Sree-Ai-Fav-icon.png" class="sree-pwa-icon" alt="Sree AI" />
          <div class="sree-pwa-texts">
            <div class="sree-pwa-title">Install Sree AI App</div>
            <div class="sree-pwa-desc">Add to your Desktop or Phone</div>
          </div>
        </div>
        <div class="sree-pwa-actions">
          <button id="sree-pwa-install-action">Install Now</button>
          <button id="sree-pwa-close-action" aria-label="Close">&times;</button>
        </div>
      `;
      document.body.appendChild(banner);

      document.getElementById('sree-pwa-install-action').addEventListener('click', () => {
        if (window.deferredPrompt) {
          window.deferredPrompt.prompt();
          banner.remove();
          sessionStorage.removeItem('sree_pwa_install');
        }
      });

      document.getElementById('sree-pwa-close-action').addEventListener('click', () => {
        banner.remove();
        sessionStorage.removeItem('sree_pwa_install');
      });

      const firstClick = () => {
        if (window.deferredPrompt && sessionStorage.getItem('sree_pwa_install') === 'true') {
          window.deferredPrompt.prompt();
          sessionStorage.removeItem('sree_pwa_install');
          banner.remove();
        }
        document.removeEventListener('click', firstClick);
      };
      setTimeout(() => {
        document.addEventListener('click', firstClick, { once: true });
      }, 400);
    }

    window.addEventListener('appinstalled', () => {
      console.log('Sree AI was successfully installed as an app');
      window.deferredPrompt = null;
      const b = document.getElementById('sree-pwa-banner');
      if (b) b.remove();
      sessionStorage.removeItem('sree_pwa_install');
    });
  </script>
