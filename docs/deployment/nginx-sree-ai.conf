# Nginx configuration for Sree AI Backend & Gemini Live Voice WebSocket
# Place in: /etc/nginx/sites-available/sree-ai
# Enable with: sudo ln -s /etc/nginx/sites-available/sree-ai /etc/nginx/sites-enabled/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    # Replace with your domain name (or keep server IP if testing directly)
    server_name api.sreeai.qzz.io 130.210.62.116;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow up to 50MB for multimodal uploads (PDFs, Audio, Screenshots, Documents)
    client_max_body_size 50M;

    # Standard REST API Routing
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gemini Live Voice WebSocket Streaming Endpoint (/api/live/voice)
    location /api/live/voice {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection alive during bidirectional audio streaming
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
